name: attendance_tracker
description: "Firebase and PDF enabled Attendance Tracker Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase Core Services
  firebase_core: ^3.10.0
  firebase_auth: ^5.4.0
  cloud_firestore: ^5.6.0
  firebase_messaging: ^15.2.0

  # PDF Generation and Printing
  pdf: ^3.10.8
  printing: ^5.13.1

  # UI Components and Helpers
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  flutter_svg: ^2.0.17

  # Device Hardware and Permissions
  permission_handler: ^11.3.1
  device_info_plus: ^11.0.0
  local_auth: ^2.3.0

  # Bluetooth Low Energy (BLE)
  flutter_blue_plus: ^1.36.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  # Asset management for icons and images
  assets:
    - assets/icon/

# Configuration for flutter_launcher_icons package
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon_white.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon_transparent.png"